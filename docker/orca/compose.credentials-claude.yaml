# Credential overlay (Claude-only) — opt-in operator-injected credentials.
# Usage from docker/orca/:  docker compose -f compose.yaml -f compose.credentials-claude.yaml up -d
# Host file: ./credentials/claude.env (secure host preparation required).
# This overlay declares only the Claude source, so Compose never fails on an
# absent opencode.env.
services:
  orca:
    secrets:
      - source: claude_credentials
        target: /opt/state/credentials/claude.env

secrets:
  claude_credentials:
    file: ./credentials/claude.env
