# Credential overlay (combined) — opt-in operator-injected credentials.
# Usage from docker/orca/:  docker compose -f compose.yaml -f compose.credentials.yaml up -d
# Host files: ./credentials/claude.env and ./credentials/opencode.env (secure
# host preparation required: uid mapped to 1000 with 0600, or group/ACL-scoped
# 0640 — never world-readable). No uid/gid/mode claims: bind-mounted file:
# secrets retain host attributes; readability by the service user is validated
# at runtime by the entrypoint.
services:
  orca:
    secrets:
      - source: claude_credentials
        target: /opt/state/credentials/claude.env
      - source: opencode_credentials
        target: /opt/state/credentials/opencode.env

secrets:
  claude_credentials:
    file: ./credentials/claude.env
  opencode_credentials:
    file: ./credentials/opencode.env
