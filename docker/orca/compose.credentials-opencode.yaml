# Credential overlay (OpenCode-only) — opt-in operator-injected credentials.
# Usage from docker/orca/:  docker compose -f compose.yaml -f compose.credentials-opencode.yaml up -d
# Host file: ./credentials/opencode.env (secure host preparation required).
# This overlay declares only the OpenCode source, so Compose never fails on an
# absent claude.env.
services:
  orca:
    secrets:
      - source: opencode_credentials
        target: /opt/state/credentials/opencode.env

secrets:
  opencode_credentials:
    file: ./credentials/opencode.env
