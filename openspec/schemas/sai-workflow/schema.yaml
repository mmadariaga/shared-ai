# sai-workflow — custom OpenSpec schema for the shared-AI pipeline
#
# Encodes the full 11-artifact graph with dependency edges and apply requirements.
# Stored here (not in spec-driven) so CLI updates never overwrite it.
# See design.md D1 for rationale.

name: sai-workflow
version: 1
description: shared-AI pipeline — proposal → specs → design → tasks → interfaces → implementation → review → audits

artifacts:
  - id: proposal
    generates: proposal.md
    description: Change proposal — why this change is needed, what it affects, and which capabilities are in scope
    template: proposal.md
    instruction: |
      Create proposal.md establishing WHY this change is needed.

      Sections:
      - **Complexity**: the FIRST line of the file, immediately above `## Why`, separated from it by one blank line.
        Form: `**Complexity**: <token>` where <token> is exactly one of `low`, `medium`, `high`.
        An optional trailing parenthetical may follow for audit, e.g. `medium (3 files, no breaking change)`;
        parsers ignore everything from the first `(` onward.
        Derive the token using `## Complexity Derivation Rubric` in sai/commands/spec/instructions.md.
        Because the requirements count is one of the rubric's signals, derive or revise the token AFTER
        specs/**/*.md are written, before reporting completion. Never invent a tier outside the three.
        The line is descriptive metadata: it names no model, vendor, price tier, or harness.
      - **Why**: 1-2 sentences. What problem does this solve? Why now?
      - **What Changes**: Bullet list. Mark breaking changes with **BREAKING**.
      - **Capabilities**:
        - **New Capabilities**: capabilities being introduced. Each becomes specs/<name>/spec.md. Use kebab-case.
        - **Modified Capabilities**: existing capabilities whose requirements are changing. Only include if spec-level behavior changes.
      - **Impact**: affected code, APIs, dependencies, or systems.
      - **Proposal Research Documentation**: list of relevant files and URLs consulted during proposal research.
      - **Additional Notes**: Any other info gathered during the spec that may be relevant.

      The Capabilities section is critical — it is the contract between proposal and specs.
      Research existing specs before filling it in. Keep it concise (1-2 pages).
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: Capability delta specs — one per capability listed in the proposal
    template: specs.md
    instruction: |
      Create one spec file per capability in the proposal's Capabilities section.
      - New capabilities: specs/<capability>/spec.md (kebab-case name from proposal)
      - Modified capabilities: specs/<existing-name>/spec.md

      Delta operations (## headers):
      - **ADDED Requirements**: new behavior
      - **MODIFIED Requirements**: changed behavior — include full updated content
      - **REMOVED Requirements**: deprecated features — include Reason and Migration
      - **RENAMED Requirements**: name changes — use FROM:/TO: format

      Format:
      - Requirement: `### Requirement: <name>` followed by description
      - Use SHALL/MUST for normative requirements
      - Scenario: `#### Scenario: <name>` with WHEN/THEN format
      - CRITICAL: Scenarios MUST use exactly 4 hashtags (####)
      - Every requirement MUST have at least one scenario
      - CRITICAL: Do NOT use fenced code blocks (```) inside requirement bodies. The parser
        treats any line starting with ## as a section boundary even inside fenced blocks,
        which breaks scenario detection. Use 4-space indented blocks instead.
    requires:
      - proposal

  - id: design
    generates: design.md
    description: Technical design — decisions, trade-offs, Target State, and ADR/DDR evaluation with the record family resolved by the ordered routing test
    template: design.md
    instruction: |
      Fetch and follow sai/commands/design/instructions.md section ### Generate design.md exactly. This instruction is an informative reference only; it does not restate the design generation contract.
    requires:
      - proposal
      - specs

  - id: tasks
    generates: tasks.md
    description: Implementation planning scaffold — narrative steps for human review and sai-3-implement to expand
    template: tasks.md
    instruction: |
      Fetch and follow sai/commands/design/instructions.md section ### Generate tasks.md exactly. This instruction is an informative reference only; it does not restate the task generation contract.
    requires:
      - specs
      - design

  - id: interfaces
    generates: interfaces.md
    description: Per-step interface contract — new/modified public signatures plus exact spec-anchored test assertions, keyed by Step N to tasks.md; consumable without the implementation body
    template: interfaces.md
    instruction: |
      Fetch and follow sai/commands/design/instructions.md section ### Generate interfaces.md exactly. This instruction is an informative reference only; it does not restate the interface generation contract.
    requires:
      - tasks

  - id: change-overview
    generates: change-overview.md
    description: Derived review projection consolidating proposal, specs, design, tasks, and interfaces into one review-oriented document organized by capability and behavior; generated by a budget-routed subagent after the sai-2 feedback loop closes, regenerated once per later effective source-modifying design-worker transaction
    template: change-overview.md
    instruction: |
      Create change-overview.md — a single structured review projection consolidating the five
      completed sai-2 source artifacts (proposal.md, specs/**/*.md, design.md, tasks.md, interfaces.md),
      organized by capability and behavior, never as a concatenation of the source documents. The
      overview is a derived projection, not a source of truth: the source artifacts remain
      authoritative and are never modified by generation.

      Generation runs in a budget-routed subagent executing the shared overview-generation
      instruction at sai/commands/design/change-overview.md — the single source of the generation
      contract — at the sai-2 feedback gate's Continue processing (deferred materialization), with
      exactly one regeneration per later effective source-modifying design-worker transaction and a
      persisted overview.state in the change's .openspec.yaml
      (unmaterialized | materializing | failed | current | stale). For the normative generation
      contract — section organization, fidelity rules, pre-write validation, the closed five-field
      generator result envelope, and failure-handling — Fetch and follow
      sai/commands/design/change-overview.md exactly. This instruction is an informative reference
      only; it does not restate the generation contract.
    requires: [interfaces]

  - id: implementation
    generates: implementation.md
    description: Granular implementation plan — code-level steps with RED→GREEN and STOP & COMMIT markers, with Discarded findings sub-blocks inside audit steps derived from review.md / security.md / performance.md / accessibility.md
    template: implementation.md
    instruction: |
      Fetch and follow sai/commands/implement/implementation-plan.template.md exactly. This instruction is an informative reference only; it does not restate the implementation plan contract.
    requires:
      - tasks

  - id: review
    generates: review.md
    description: Code review report — correctness, maintainability, testing, surface triage
    template: review.md
    instruction: |
      Fetch and follow sai/commands/review/review-report.template.md exactly. This instruction is an informative reference only; it does not restate the review report contract.
    requires:
      - implementation

  - id: security
    generates: security.md
    description: Security audit — SAST + SCA, CWE/CVE mapping, OWASP compliance
    template: security.md
    instruction: |
      Fetch and follow sai/commands/security/security-report.template.md exactly. This instruction is an informative reference only; it does not restate the security report contract.
    requires:
      - implementation

  - id: performance
    generates: performance.md
    description: Performance audit — backend / frontend / db / queue tiers, evidence-based
    template: performance.md
    instruction: |
      Fetch and follow sai/commands/performance/performance-report.template.md exactly. This instruction is an informative reference only; it does not restate the performance report contract.
    requires:
      - implementation

  - id: accessibility
    generates: accessibility.md
    description: Accessibility audit — WCAG 2.2 AA static review, optional runtime axe/Lighthouse
    template: accessibility.md
    instruction: |
      Fetch and follow sai/commands/accessibility/accessibility-report.template.md exactly. This instruction is an informative reference only; it does not restate the accessibility report contract.
    requires:
      - implementation

apply:
  requires: [tasks, implementation]
  tracks: implementation.md
  instruction: |
    Read context files, work through pending tasks, mark complete as you go.
    Pause if you hit blockers or need clarification.
